<div class="luxury-container" *ngIf="!isLoading && restaurant">
  <div class="luxury-card">
    <!-- Nouvel en-tête premium -->
    <div class="glass-header">
      <div class="header-content">
        <h1 class="luxury-title">
          <span>Fiche Restaurant</span>
          <div class="title-decoration"></div>
        </h1>
        <div class="status-badge" [class.pending]="restaurant.statut === 'EN_ATTENTE'">
          <div class="status-glow"></div>
          {{ restaurant.statut }}
        </div>
      </div>
    </div>

    <!-- Corps existant -->
    <div class="details-grid">
      <div class="detail-row" *ngIf="restaurant.matricule">
        <span class="detail-label">Matricule</span>
        <span class="detail-value">{{ restaurant.matricule }}</span>
      </div>
      <div class="detail-row" *ngIf="restaurant.email">
        <span class="detail-label">Email</span>
        <span class="detail-value">{{ restaurant.email }}</span>
      </div>
      <div class="detail-row" *ngIf="restaurant.telephone">
        <span class="detail-label">Téléphone</span>
        <span class="detail-value">{{ restaurant.telephone }}</span>
      </div>
      <div class="detail-row" *ngIf="restaurant.adresse">
        <span class="detail-label">Adresse</span>
        <span class="detail-value">{{ restaurant.adresse }}</span>
      </div>
      <div class="detail-row" *ngIf="restaurant.typeCuisine">
        <span class="detail-label">Type de cuisine</span>
        <span class="detail-value">{{ restaurant.typeCuisine }}</span>
      </div>
      <div class="detail-row" *ngIf="restaurant.dateDemande">
        <span class="detail-label">Date d'inscription</span>
        <span class="detail-value">{{ formatDate(restaurant.dateDemande) }}</span>
      </div>
    </div>

    <!-- Nouveau Footer avec deux boutons -->
    <div class="luxury-footer" *ngIf="restaurant.statut === 'EN_ATTENTE'">
      <button class="luxury-button accept-button" (click)="accept()">
        <span class="button-text">Accepter</span>
      </button>
      <button class="luxury-button reject-button" (click)="reject()">
        <span class="button-text">Rejeter</span>
      </button>
    </div>
    

    <!-- Effets d'arrière-plan -->
    <div class="bg-circles">
      <div class="circle-1"></div>
      <div class="circle-2"></div>
      <div class="circle-3"></div>
    </div>
  </div>
</div>
