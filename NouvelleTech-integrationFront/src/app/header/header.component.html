<header class="header">
  <div class="container">
    <div class="logo">
      <a routerLink="/">
        <span class="logo-text">FoodMatch</span>
        <span class="logo-dot"></span>
      </a>
    </div>
    
    <div class="search-bar">
      <div class="search-container">
        <input type="text" placeholder="Rechercher restaurants, plats..." 
               [(ngModel)]="searchQuery" (keyup)="onSearch()">
        <i class="fas fa-search search-icon"></i>
      </div>
      <div class="search-results" *ngIf="showSearchResults">
        <div *ngIf="isSearching" class="search-loading">
          <i class="fas fa-spinner fa-spin"></i> Recherche en cours...
        </div>
        <ul *ngIf="!isSearching && searchResults.length > 0">
          <li *ngFor="let result of searchResults" (click)="goToRestaurant(result.id)">
            <div class="search-result-item">
              <div class="search-result-image" *ngIf="result.images && result.images.length > 0">
                <img [src]="result.images[0].lien" alt="{{ result.nomEntreprise }}">
              </div>
              <div class="search-result-image" *ngIf="!result.images || result.images.length === 0">
                <div class="placeholder-image">🍽️</div>
              </div>
              <div class="search-result-info">
                <h4>{{ result.nomEntreprise }}</h4>
                <p *ngIf="result.typeCuisine">{{ result.typeCuisine }}</p>
                <div class="search-result-rating" *ngIf="result.rating">
                  <span class="stars">⭐</span> {{ result.rating | number:'1.1-1' }}
                </div>
              </div>
            </div>
          </li>
        </ul>
        <div *ngIf="!isSearching && searchResults.length === 0 && searchQuery.trim().length > 0" class="no-results">
          Aucun résultat trouvé pour "{{ searchQuery }}"
        </div>
      </div>
    </div>
    
    <nav class="nav">
     <div class="dropdown-container" 
           (click)="toggleDropdown($event)"
           (mouseenter)="showDropdown = true">
        <button class="nav-item dropdown-toggle">
          <span>Restaurants</span>
          <i class="fas fa-chevron-down dropdown-arrow" [class.rotate]="showDropdown"></i>
        </button>
        <ul class="dropdown-menu" *ngIf="showDropdown" @dropdownAnimation>
          <li>
            <a routerLink="/restaurants" (click)="$event.stopPropagation(); showDropdown = false">
              <i class="fas fa-th-list"></i>
              Tous les restaurants
            </a>
          </li>
          <li class="dropdown-divider"></li>
          <li *ngFor="let category of restaurantCategories">
            <a href="#" (click)="$event.stopPropagation(); showDropdown = false">
              <i class="fas fa-utensils"></i>
              {{category.name}}
            </a>
          </li>
        </ul>
      </div>
      
      <!-- Bouton de connexion (visible uniquement si non connecté) -->
      <button *ngIf="!isUserLoggedIn" class="nav-item btn-signup" (click)="openAuthModal()">
        <i class="fas fa-user"></i>
        <span>Connexion</span>
      </button>
      
      <!-- Composant de profil utilisateur (visible uniquement si connecté) -->
      <app-user-profile *ngIf="isUserLoggedIn"></app-user-profile>
    </nav>
    
    <button class="mobile-menu-btn">
      <i class="fas fa-bars"></i>
    </button>
  </div>
</header>

<!-- Modal d'authentification (déplacé en dehors du header) -->
<div class="auth-modal-overlay" *ngIf="showAuthModal" (click)="closeAuthModal()">
  <div class="auth-modal-container" (click)="$event.stopPropagation()">
    <button class="close-button" (click)="closeAuthModal()">×</button>
    <app-auth-selection (closeModal)="closeAuthModal()"></app-auth-selection>
  </div>
</div>
