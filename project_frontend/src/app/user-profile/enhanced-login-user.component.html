<div class="login-container">
  <h2>Connexion</h2>
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Message d'erreur -->
    <div class="error-message" *ngIf="loginError">
      {{ loginError }}
    </div>
    
    <!-- Champ email -->
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email"
        placeholder=" ">
      <div class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <span *ngIf="loginForm.get('email')?.errors?.['required']">L'email est requis</span>
        <span *ngIf="loginForm.get('email')?.errors?.['email']">Format d'email invalide</span>
      </div>
    </div>
    
    <!-- Champ mot de passe -->
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password"
        placeholder=" ">
      <div class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Le mot de passe est requis</span>
      </div>
    </div>
    
    <!-- Bouton de connexion -->
    <div class="form-footer">
      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </div>
    
    <!-- Lien mot de passe oublié -->
    <div class="forgot-password">
      <a href="#">Mot de passe oublié ?</a>
    </div>
  </form>
</div>
